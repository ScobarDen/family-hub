name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile

      - name: Lint, format check, typecheck
        run: vp check

      - name: FEOD levels and deep imports
        run: vp run feod

      - name: Tests
        run: vp run -r test

      - name: Build Mini App
        run: vp run @family-hub/web#build

      - name: Worker dry-run deploy
        run: vp run @family-hub/api#build
