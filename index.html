<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Hub — PROTOTYPE v3</title>
<!-- PROTOTYPE v3 (no Profile tab, settings via the Telegram menu): throwaway UI shell for https://github.com/ScobarDen/family-hub/issues/19. Telegram-style tab bar, configurable tabs, single-pet tab, iOS/Android looks via ?platform=ios|android. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f0f2f5);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #3390ec);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --section: var(--tg-theme-section-bg-color, #ffffff);
    --header-text: var(--tg-theme-section-header-text-color, #3390ec);
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --sep: rgba(127,127,127,.18);
  }
  html.dark-fallback {
    --bg: var(--tg-theme-bg-color, #17212b);
    --bg2: var(--tg-theme-secondary-bg-color, #0e1621);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --accent: var(--tg-theme-button-color, #5288c1);
    --section: var(--tg-theme-section-bg-color, #17212b);
    --header-text: var(--tg-theme-section-header-text-color, #6ab3f3);
  }
  html, body { background: var(--bg2); color: var(--text); }
  body.android { font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
  body.ios { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
  .hint { color: var(--hint); }
  .accent { color: var(--accent); }
  .section { background: var(--section); }
  body.ios .section { border-radius: 12px; }
  body.android .section { border-radius: 18px; }
  .section-title { color: var(--header-text); font-size: 13px; font-weight: 600; padding: 16px 20px 6px; }
  body.ios .section-title { color: var(--hint); text-transform: uppercase; font-weight: 400; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; border-top: 1px solid var(--sep); }
  .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  body.android .tile { border-radius: 50%; }
  .tile svg { width: 18px; height: 18px; }
  .big-title { font-size: 30px; font-weight: 700; padding: 8px 20px 4px; }
  body.android .big-title { font-size: 26px; font-weight: 600; }
  .chip { border-radius: 999px; padding: 7px 16px; white-space: nowrap; font-weight: 600; color: var(--hint); background: var(--section); }
  .chip.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--section)); }
  .btn { background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 12px 16px; font-weight: 600; }
  .btn-tonal { background: color-mix(in srgb, var(--accent) 15%, var(--section)); color: var(--accent); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
  .progress { height: 6px; border-radius: 3px; background: var(--sep); }
  .progress > div { height: 6px; border-radius: 3px; background: var(--accent); }
  .overdue { color: var(--danger); }
  .done-text { color: var(--hint); text-decoration: line-through; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hint); display: grid; place-items: center; flex: none; }
  .check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .check svg { width: 14px; height: 14px; }

  .tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20; display: flex; padding: 6px; }
  body.android .tabbar { background: var(--section); border-radius: 26px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  body.ios .tabbar { background: color-mix(in srgb, var(--section) 70%, transparent); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: 30px; border: 1px solid var(--sep); box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; color: var(--text); border-radius: 20px; min-width: 0; }
  .tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--accent); }
  body.android .tab.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  body.ios .tab.on { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .tab .ava { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; background: #f6c58f; }
  .tab.on .ava { outline: 2px solid var(--accent); }

  body.android .press { position: relative; overflow: hidden; }
  body.android .press:active { background: color-mix(in srgb, var(--text) 8%, transparent); }
  body.ios .press:active { opacity: .55; }

  #proto-bar { position: fixed; top: 8px; right: 8px; z-index: 50; background: #111; color: #fff; border-radius: 999px; padding: 4px 6px; font: 600 12px system-ui; display: flex; gap: 4px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.35); opacity: .92; }
  #proto-bar select { background: #222; color: #fff; border-radius: 999px; padding: 2px 6px; }
  #app { padding-top: 36px; padding-bottom: 110px; }
  svg.lucide { width: 20px; height: 20px; }
</style>
</head>
<body>
<div id="app" class="min-h-screen"></div>
<div id="proto-bar"></div>
<script>
const tg = window.Telegram?.WebApp;
const inTelegram = !!tg?.initData;
if (tg) { tg.ready(); tg.expand(); }

const base = location.pathname.startsWith('/family-hub') ? '/family-hub/' : '/';
const params = () => new URLSearchParams(location.search);
const platform = () => params().get('platform') || (['ios', 'macos'].includes(tg?.platform) ? 'ios' : tg?.platform === 'android' ? 'android' : 'android');
const theme = () => params().get('theme') || (tg?.colorScheme ?? 'light');
const route = () => location.pathname.slice(base.length).replace(/\/$/, '');
const icon = name => `<i data-lucide="${name}"></i>`;
const money = n => n.toLocaleString('ru-RU') + ' ₽';

const pets = [{ id: 'buick', name: 'Бьюик', emoji: '🐕' }];
const modules = {
  feed: { title: 'Лента', icon: 'list' },
  plans: { title: 'Планы', icon: 'list-checks' },
  calendar: { title: 'Календарь', icon: 'calendar' },
  pet: { title: pets.length === 1 ? pets[0].name : 'Питомцы', icon: 'dog', pet: pets.length === 1 ? pets[0] : null },
  goals: { title: 'Цели', icon: 'piggy-bank' },
};
const DEFAULT_TABS = ['feed', 'plans', 'calendar', 'pet'];
function loadTabs() { try { const t = JSON.parse(localStorage.getItem('proto-tabs')); return Array.isArray(t) && t.length ? t : DEFAULT_TABS; } catch { return DEFAULT_TABS; } }
function saveTabs(t) { try { localStorage.setItem('proto-tabs', JSON.stringify(t)); } catch {} }
let tabs = loadTabs();

const plans = [
  { id: 'bedroom', title: 'Ремонт в спальне', due: 'до 30 ноя', visibility: 'Shared', subs: [
    { title: 'Выбрать обои', done: true, by: 'Маша' }, { title: 'Купить краску', done: true, by: 'Денис' },
    { title: 'Покрасить потолок', done: false, due: '12 окт' }, { title: 'Поклеить обои', done: false }, { title: 'Собрать шкаф', done: false } ] },
  { id: 'trip', title: 'Поездка в Казань', due: '15–18 ноя', visibility: 'Shared', subs: [
    { title: 'Билеты', done: true, by: 'Денис' }, { title: 'Отель', done: false }, { title: 'Кто посидит с Бьюиком', done: false } ] },
  { id: 'gift', title: 'Подарок Маше', due: '', visibility: 'Private', subs: [] },
];

const feed = [
  { group: 'Предстоит', items: [
    { t: 'Сегодня 19:00', icon: 'calendar', color: '#3390ec', title: 'Созвон с мамой', by: '', kind: 'calendar' },
    { t: '12 окт', icon: 'list-checks', color: '#8e6ce8', title: 'Покрасить потолок · Ремонт в спальне', by: '', kind: 'plans' },
    { t: '12 ноя', icon: 'syringe', color: '#e2574c', title: 'Бьюик: прививка от бешенства', by: '', kind: 'pet' },
  ] },
  { group: 'Сегодня', items: [
    { t: '08:10', icon: 'footprints', color: '#36b37e', title: 'Бьюик погулял 40 мин', by: 'Денис', kind: 'pet' },
    { t: '07:55', icon: 'bone', color: '#f5a623', title: 'Бьюик покормлен', by: 'Маша', kind: 'pet' },
  ] },
  { group: 'Вчера', items: [
    { t: '21:30', icon: 'circle-check', color: '#8e6ce8', title: 'Выполнено: Купить краску', by: 'Денис', kind: 'plans' },
    { t: '18:02', icon: 'piggy-bank', color: '#f5a623', title: 'Отпуск в Турции +10 000 ₽', by: 'Денис', kind: 'goals' },
  ] },
];

function go(path, { replace = false } = {}) {
  const url = base + path + location.search;
  replace ? history.replaceState(null, '', url) : history.pushState(null, '', url);
  render();
}
function setParam(k, v) { const p = params(); p.set(k, v); history.replaceState(null, '', location.pathname + '?' + p); render(); }

function tabIcon(id) {
  const m = modules[id];
  if (id === 'pet' && m.pet) return `<div class="ava">${m.pet.emoji}</div>`;
  return icon(m.icon);
}

function tabbar(active) {
  return `<nav class="tabbar">${tabs.map(id => `<button class="tab press ${active === id ? 'on' : ''}" data-go="${id}">${tabIcon(id)}<span>${modules[id].title}</span></button>`).join('')}</nav>`;
}

function feedScreen() {
  const filter = params().get('feed') || 'all';
  const chips = [['all', 'Все'], ['plans', 'Планы'], ['pet', pets.length === 1 ? pets[0].name : 'Питомцы'], ['calendar', 'Календарь'], ['goals', 'Цели']];
  return `<div class="big-title">Лента</div>
    <div class="flex gap-2 overflow-x-auto px-4 py-2">${chips.map(([k, t]) => `<button class="chip press ${filter === k ? 'on' : ''}" data-feed="${k}">${t}</button>`).join('')}</div>
    ${feed.map(g => {
      const items = g.items.filter(i => filter === 'all' || i.kind === filter);
      if (!items.length) return '';
      return `<div class="section-title">${g.group}</div><div class="section mx-3">${items.map(i => `
        <div class="row press"><div class="tile" style="background:${i.color}">${icon(i.icon)}</div>
        <div class="flex-1 min-w-0"><div class="truncate">${i.title}</div><div class="hint text-xs">${i.t}${i.by ? ' · ' + i.by : ''}</div></div></div>`).join('')}</div>`;
    }).join('')}`;
}

function plansScreen() {
  return `<div class="big-title">Планы</div>
    <div class="section mx-3 mt-3">${plans.map(p => {
      const done = p.subs.filter(s => s.done).length;
      const pct = p.subs.length ? Math.round(done / p.subs.length * 100) : 0;
      return `<div class="row press" data-go="plans/${p.id}">
        <div class="tile" style="background:#8e6ce8">${icon('list-checks')}</div>
        <div class="flex-1 min-w-0"><div class="flex justify-between"><span class="truncate">${p.title}</span><span class="hint text-xs">${p.visibility === 'Private' ? '🔒' : ''}</span></div>
        <div class="hint text-xs mb-1">${p.subs.length ? `${done} из ${p.subs.length}` : 'без подпланов'}${p.due ? ' · ' + p.due : ''}</div>
        ${p.subs.length ? `<div class="progress"><div style="width:${pct}%"></div></div>` : ''}</div></div>`;
    }).join('')}</div>`;
}

function planScreen(id) {
  const p = plans.find(x => x.id === id);
  const done = p.subs.filter(s => s.done).length;
  return `<div class="big-title">${p.title}</div>
    <div class="hint px-5 mb-2">${p.due} · ${done} из ${p.subs.length} · ${p.visibility}</div>
    <div class="px-5 mb-2"><div class="progress"><div style="width:${p.subs.length ? done / p.subs.length * 100 : 0}%"></div></div></div>
    <div class="section-title">Подпланы</div>
    <div class="section mx-3">${p.subs.map(s => `<div class="row press"><div class="check ${s.done ? 'on' : ''}">${s.done ? icon('check') : ''}</div>
      <div class="flex-1"><div class="${s.done ? 'done-text' : ''}">${s.title}</div><div class="hint text-xs">${s.done ? 'выполнил(а) ' + s.by : s.due || ''}</div></div></div>`).join('')}
      <div class="row press accent">${icon('plus')} Добавить подплан</div></div>`;
}

function calendarScreen() {
  const days = Array.from({ length: 31 }, (_, i) => i + 1);
  return `<div class="big-title">Календарь</div>
    <div class="section mx-3 mt-3 p-3"><div class="flex justify-between mb-2"><b>Октябрь 2026</b><span class="hint flex">${icon('chevron-left')}${icon('chevron-right')}</span></div>
      <div class="grid grid-cols-7 gap-1 text-center text-sm">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="hint text-xs">${d}</div>`).join('')}<div></div><div></div><div></div>
      ${days.map(d => `<div class="py-1 rounded-full ${d === 4 ? 'text-white' : ''}" style="${d === 4 ? 'background:var(--accent)' : ''}">${d}</div>`).join('')}</div></div>
    <div class="section-title">Ближайшее</div>
    <div class="section mx-3">${feed[0].items.map(i => `<div class="row press"><div class="tile" style="background:${i.color}">${icon(i.icon)}</div><div class="flex-1"><div>${i.title}</div><div class="hint text-xs">${i.t}</div></div></div>`).join('')}</div>`;
}

function petScreen() {
  if (!modules.pet.pet) return `<div class="big-title">Питомцы</div>`;
  return `<div class="flex flex-col items-center pt-2 pb-3"><div class="w-24 h-24 rounded-full grid place-items-center text-5xl" style="background:#f6c58f">🐕</div>
      <div class="text-2xl font-bold mt-2">Бьюик</div><div class="hint text-sm">Собака · 4 года</div></div>
    <div class="flex gap-2 px-3"><button class="btn flex-1 press">🍖 Покормили</button><button class="btn flex-1 press">🦮 Погуляли</button></div>
    <div class="section-title">Сегодня</div>
    <div class="section mx-3"><div class="row"><div class="tile" style="background:#f5a623">${icon('bone')}</div><div class="flex-1">Кормлений</div><b>1</b></div>
      <div class="row"><div class="tile" style="background:#36b37e">${icon('footprints')}</div><div class="flex-1">Последняя прогулка</div><span class="hint">08:10</span></div></div>
    <div class="section-title">Скоро</div>
    <div class="section mx-3"><div class="row"><div class="tile" style="background:#e2574c">${icon('syringe')}</div><div class="flex-1">Бешенство</div><span class="hint text-sm">12 ноя</span></div>
      <div class="row overdue"><div class="tile" style="background:#e2574c">${icon('bug')}</div><div class="flex-1">Клещи</div><span class="text-sm">просрочено</span></div></div>
    <div class="section mx-3 mt-3"><div class="row press" data-go="pet/settings"><div class="tile" style="background:#8a8f98">${icon('settings')}</div><div class="flex-1">Карточка и настройки Бьюика</div>${icon('chevron-right')}</div></div>`;
}

function petSettingsScreen() {
  return `<div class="big-title">Бьюик</div>
    <div class="section mx-3 mt-3">${[['Имя', 'Бьюик'], ['Вид', 'Собака'], ['Порода', 'Бостон-терьер'], ['Дата рождения', '12.03.2022'], ['Чип', '643…1234']].map(([k, v]) => `<div class="row"><div class="flex-1">${k}</div><span class="hint">${v}</span></div>`).join('')}</div>
    <div class="section mx-3 mt-3"><div class="row press accent">${icon('archive')} В архив</div></div>`;
}

function goalsScreen() {
  return `<div class="big-title">Цели</div>
    <div class="section mx-3 mt-3 p-4"><div class="hint text-xs">Всего накоплено</div><div class="text-3xl font-bold">${money(230000)}</div></div>
    <div class="section mx-3 mt-3"><div class="row press"><div class="tile" style="background:#3390ec">${icon('plane')}</div><div class="flex-1"><div>Отпуск в Турции</div><div class="progress mt-1"><div style="width:50%"></div></div></div><span class="hint text-sm">50%</span></div></div>`;
}

function profileScreen() {
  const hidden = Object.keys(modules).filter(id => !tabs.includes(id));
  return `<div class="flex flex-col items-center pt-2 pb-2"><div class="w-24 h-24 rounded-full grid place-items-center text-4xl text-white" style="background:#3390ec">Д</div>
      <div class="text-2xl font-bold mt-2">Денис</div><div class="hint text-sm">Семья «Гущины» · Owner</div></div>
    ${hidden.length ? `<div class="section-title">Модули</div><div class="section mx-3">${hidden.map(id => `<div class="row press" data-go="${id}"><div class="tile" style="background:#8a8f98">${icon(modules[id].icon)}</div><div class="flex-1">${modules[id].title}</div>${icon('chevron-right')}</div>`).join('')}</div>` : ''}
    <div class="section-title">Приложение</div>
    <div class="section mx-3">
      <div class="row press" data-go="profile/tabs"><div class="tile" style="background:#3390ec">${icon('panel-bottom')}</div><div class="flex-1">Нижнее меню</div><span class="hint text-sm">${tabs.length} из 5</span>${icon('chevron-right')}</div>
      <div class="row press"><div class="tile" style="background:#e2574c">${icon('bell')}</div><div class="flex-1">Уведомления от бота</div><span class="hint text-sm">Вкл</span></div>
      <div class="row press"><div class="tile" style="background:#36b37e">${icon('globe')}</div><div class="flex-1">Часовой пояс</div><span class="hint text-sm">Москва</span></div>
    </div>
    <div class="section-title">Семья</div>
    <div class="section mx-3">
      <div class="row press"><div class="tile" style="background:#8e6ce8">${icon('users')}</div><div class="flex-1">Участники</div><span class="hint text-sm">2</span></div>
      <div class="row press"><div class="tile" style="background:#f5a623">${icon('user-plus')}</div><div class="flex-1">Пригласить</div></div>
      <div class="row press"><div class="tile" style="background:#00b8d9">${icon('image')}</div><div class="flex-1">Хранилище фото</div><span class="hint text-sm">Подключено</span></div>
    </div>`;
}

function tabsScreen() {
  const ids = Object.keys(modules);
  const order = [...tabs, ...ids.filter(id => !tabs.includes(id))];
  return `<div class="big-title">Нижнее меню</div>
    <div class="hint px-5 text-sm">От 2 до 5 разделов. Профиль и настройки — в меню «⋯ → Настройки».</div>
    <div class="section-title">Разделы</div>
    <div class="section mx-3">${order.map(id => {
      const on = tabs.includes(id);
      const i = tabs.indexOf(id);
      return `<div class="row"><div class="tile" style="background:${on ? 'var(--accent)' : '#8a8f98'}">${icon(modules[id].icon)}</div>
        <div class="flex-1">${modules[id].title}</div>
        ${on ? `<button class="hint press" data-move="${id}:-1" ${i === 0 ? 'disabled style="opacity:.3"' : ''}>${icon('chevron-up')}</button><button class="hint press" data-move="${id}:1" ${i === tabs.length - 1 ? 'disabled style="opacity:.3"' : ''}>${icon('chevron-down')}</button>` : ''}
        <input type="checkbox" class="w-5 h-5" data-toggle="${id}" ${on ? 'checked' : ''}></div>`;
    }).join('')}
    </div>`;
}

const screens = {
  feed: feedScreen, plans: plansScreen, calendar: calendarScreen, pet: petScreen, goals: goalsScreen, profile: profileScreen,
  'profile/tabs': tabsScreen, 'pet/settings': petSettingsScreen,
};

function render() {
  document.body.className = platform();
  document.documentElement.classList.toggle('dark-fallback', theme() === 'dark');
  let r = route();
  if (!r) return go(tabs[0], { replace: true });
  const [top, sub] = r.split('/');
  const html = top === 'plans' && sub ? planScreen(sub) : (screens[r] || screens[top] || feedScreen)();
  document.getElementById('app').innerHTML = html + (top === 'profile' ? '' : tabbar(top));
  renderProtoBar();
  window.lucide?.createIcons();
  if (tg) { sub || top === 'profile' ? tg.BackButton.show() : tg.BackButton.hide(); tg.MainButton.hide(); tg.SettingsButton?.show(); }
}

function renderProtoBar() {
  const opt = (name, values, cur) => `<select data-param="${name}">${values.map(([v, t]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  document.getElementById('proto-bar').innerHTML = `<span>v3</span>${opt('platform', [['android', 'Android'], ['ios', 'iOS']], platform())}${inTelegram ? '' : opt('theme', [['light', 'Светлая'], ['dark', 'Тёмная']], theme()) + '<button data-go="profile" title="Имитация «⋯ → Настройки»">⚙</button>'}`;
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-go]');
  if (nav) { tg?.HapticFeedback?.selectionChanged(); return go(nav.dataset.go); }
  const chip = e.target.closest('[data-feed]');
  if (chip) return setParam('feed', chip.dataset.feed);
  const mv = e.target.closest('[data-move]');
  if (mv) {
    const [id, d] = mv.dataset.move.split(':'); const i = tabs.indexOf(id); const j = i + Number(d);
    [tabs[i], tabs[j]] = [tabs[j], tabs[i]]; saveTabs(tabs); return render();
  }
  if (e.target.closest('.btn')) tg?.HapticFeedback?.impactOccurred('light');
});
document.addEventListener('change', e => {
  if (e.target.dataset.param) return setParam(e.target.dataset.param, e.target.value);
  const id = e.target.dataset.toggle;
  if (!id) return;
  if (e.target.checked && tabs.length >= 5) { e.target.checked = false; return tg?.showAlert ? tg.showAlert('Максимум 5 разделов') : alert('Максимум 5 разделов'); }
  if (!e.target.checked && tabs.length <= 2) { e.target.checked = true; return tg?.showAlert ? tg.showAlert('Минимум 2 раздела') : alert('Минимум 2 раздела'); }
  tabs = e.target.checked ? [...tabs, id] : tabs.filter(t => t !== id);
  saveTabs(tabs); render();
});
window.addEventListener('popstate', render);
tg?.BackButton.onClick(() => history.back());
tg?.SettingsButton?.onClick(() => go('profile'));
tg?.onEvent?.('themeChanged', render);

render();
</script>
</body>
</html>
